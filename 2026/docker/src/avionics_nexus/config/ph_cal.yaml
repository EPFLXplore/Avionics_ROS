/**:
  ros__parameters:
    # pH probe calibration. Applied ON THE MCU: Nexus replays these two numbers
    # over PhRequest on every link-up, and the firmware publishes finished pH
    # values. Nothing on this side converts anything.
    #
    #   ph = slope * volts + offset
    #
    # where `volts` is the raw ADS1114 differential reading.
    #
    # Produced by scripts/calibrate_ph.sh, which does a 3-point fit against three
    # buffers of known pH and prints the two lines to paste in below. No debugger
    # needed: the script sets the calibration to the identity (slope 1, offset 0)
    # first, which turns the MCU's conversion into a passthrough so /EL/ph_packet
    # reports raw volts, then fits the line and sends it back. Same shape as
    # scripts/calibrate_mass.sh.
    #
    # THREE points, not two. Two points always fit a line perfectly, so a worn or
    # fouled electrode yields a flawless-looking calibration and wrong readings;
    # the third point's residual is the only thing that catches it. The script
    # also reports the electrode's response as a percentage of the theoretical
    # 59.16 mV/pH, which is the number that says when to buy a new probe.
    #
    # There is no device id here or on the wire: the rover has one probe and only
    # ever will, so PhRequest names it by being the only one. The keys are read
    # by PH_SLOPE_PARAM / PH_OFFSET_PARAM in Nexus.hpp.
    #
    # BOTH numbers must be present for Nexus to replay anything - half a
    # calibration is worse than none, because the firmware fallback in
    # pHMeterThread.h at least has the right slope sign and magnitude.
    #
    # The pH hat buffers the electrode at unity gain into the ADS1114 differential
    # pair, so `volts` IS the electrode EMF. The ideal glass electrode at 25 C
    # gives 59.16 mV/pH with 0 V at pH 7, i.e. slope -16.904, offset 7.0 - that is
    # the shape these numbers should keep, and roughly what pHMeterThread.h falls
    # back to. Real electrodes drift off it as they age, which is exactly what
    # calibrating against buffers measures.
    #
    # Fitted 2026-08-13 across 4.01 / 6.86 / 9.18:
    #   57.41 mV/pH = 97.0% of theoretical  -> healthy (good is 90-105%)
    #   offset 7.128631 = +7.4 mV asymmetry potential at pH 7, well within spec
    #   worst residual 0.0056 pH - the tightest of the three fits so far
    #
    # Recalibrate when the response drops below ~90%, and replace the probe below
    # 85%. Re-run the script rather than editing these by hand: the residuals it
    # prints across three buffers are what tell you the electrode is still linear,
    # and a hand-tweaked pair has no such evidence behind it.
    #
    # Third fit on this electrode, and the trend across all three is the point:
    #
    #   2026-08-12 early   -17.460922 / 6.891526   57.27 mV/pH  96.8%   -6.2 mV
    #   2026-08-12 late    -17.265400 / 7.053987   57.92 mV/pH  97.9%   +3.1 mV
    #   2026-08-13 (below) -17.417130 / 7.128631   57.41 mV/pH  97.0%   +7.4 mV
    #
    # Read those two columns SEPARATELY, because they have stopped agreeing. The
    # response has essentially stopped moving - 97.9% then 97.0%, a 0.9% step
    # that a three-point fit cannot resolve - so the gel layer is done forming.
    # The asymmetry has not stopped: -6.2 -> +3.1 -> +7.4 mV, still walking one
    # way.
    #
    # That combination is the exact signature described further down: a later fit
    # whose SLOPE agrees while its OFFSET does not. Here it is not evidence the
    # earlier fits were premature - it says E0 is STILL settling now, so expect
    # the offset to keep moving and plan on refitting again rather than treating
    # this pair as final. It is not decay either: a dying electrode loses slope,
    # and this one has held it across three fits.
    #
    # That failure mode is invisible to every check in the script. The early fit
    # was linear - residuals were small - because the electrode WAS linear; it was
    # just on a line it would not still be on by evening. Small residuals prove
    # linearity, never that the probe has settled. The only tell is a later fit
    # whose slope agrees while its offset does not, and by then the first one has
    # already been flying. Soak the probe for hours before calibrating it.
    #
    # PROVENANCE: fitted 2026-08-13 across 4.01 / 6.86 / 9.18:
    #
    #   pH 4.01   measured  +0.1792 V -> fitted 4.0075   residual -0.0025
    #   pH 6.86   measured  +0.0151 V -> fitted 6.8656   residual +0.0056
    #   pH 9.18   measured  -0.1176 V -> fitted 9.1769   residual -0.0031
    #
    # Cross-checked: the end-to-end span, 296.8 mV over 5.17 pH = 57.41 mV/pH,
    # reproduces the fitted slope exactly.
    #
    # The top buffer was first recorded as 9.1 and corrected to 9.18, and that is
    # not a cosmetic difference. The SAME three voltages fitted against 9.1 give
    # -17.157383 / 7.095707 (58.28 mV/pH, 98.5%) with a worst residual of 0.024 -
    # four times looser than the 0.0056 above, and a reading 0.06 pH high at
    # pH 9. The residual is what caught it: a mislabelled buffer tilts the fitted
    # line and surfaces as a systematic miss on the middle point, which is
    # exactly the shape the 9.1 fit had. Three points against two parameters
    # leaves one degree of freedom, and it turns out to be sharp enough to catch
    # a 0.08 pH bookkeeping slip - so do not skip the residuals, and do not widen
    # RESID_MAX to make a fit pass.

    # --- DFRobot probe, fitted 2026-08-20 --------------------------------
    # These belong to the DFRobot electrode, NOT the probe the three fits above
    # were taken on. Swapping probes invalidates a calibration completely, so do
    # not compare these against that history - different electrode, different
    # asymmetry potential, different slope.
    #
    #   53.37 mV/pH = 90.2% of theoretical
    #   -82.6 mV asymmetry potential at pH 7
    #
    # Flagged for re-check: 90.2% clears the script's "good" band by 0.2%, and
    # -82.6 mV is well outside the +-30 mV a glass electrode normally holds.
    # A leak measured directly on 2026-08-20 (14.7 GOhm open-circuit, falling to
    # 2-4 GOhm) produces exactly this shape - slope attenuated, offset dragged
    # negative - so refit once the BNC is properly dry and see whether both move
    # back. If they do, these numbers were measuring the connector.

    # -19.543529 slope and 7.308289 offset pretty decent approx 2 poitn calib, green pcb DFRobot probe

    # --- 2026-09-02 3-point run: FAILS the 0.1 pH requirement -------------
    #
    # Run against 4.00 / 6.86 / 9.00. The pair below is what it produced; it
    # does NOT meet spec and is here only so the next person sees the evidence.
    #
    #   pH 6.86   measured  +0.0262 V -> fitted 6.644   residual -0.216
    #   pH 4.00   measured  +0.1743 V -> fitted 4.107   residual +0.107
    #   pH 9.00   measured  -0.1178 V -> fitted 9.110   residual +0.110
    #
    # No slope/offset pair can rescue this, and that is arithmetic, not opinion.
    # The middle buffer sits 0.325 pH off the line through the two end buffers.
    # Least squares already minimises the squared residuals; the best a minimax
    # line could do is split that deviation in half, so the LOWEST achievable
    # worst residual on these three readings is 0.163 pH. Retuning the two
    # numbers, by script or by hand, cannot get under 0.1. Only new readings can.
    #
    # The residual pattern names the culprit. +0.107 / -0.216 / +0.110 is the
    # 1 : -2 : 1 signature documented above - one buffer wrong by d surfaces as
    # 2d/3 at that buffer and -d/3 at the other two. 2 x 0.325 / 3 = 0.217.
    # The middle buffer is the bad point; the two ends are not implicated.
    #
    # Everything else says the electrode is fine:
    #   - the line through 4.00 and 9.00 alone is 58.42 mV/pH = 98.7% of
    #     theoretical, asymmetry +4.2 mV. That is a healthy probe.
    #   - segment slopes are 51.8 mV/pH across the low half and 67.3 across the
    #     high half. A 30% split is not electrode curvature - no glass electrode
    #     bends that hard over pH 4-9 - it is one displaced point.
    #   - against the 2026-08-13 fit, pH 4 moved -4.9 mV and pH 9 moved -0.2 mV,
    #     while pH 6.86 moved +11.1 mV. Only the middle point moved.
    #
    # +11 mV at the middle buffer means the solution read MORE ACIDIC than its
    # label. Two things do that, and both are fixed by redoing the run:
    #   1. a stale or cross-contaminated 6.86 buffer. An opened neutral buffer
    #      absorbs CO2 and drifts acidic; so does carryover from the storage
    #      solution or the pH 4 bottle on a short rinse. 6.86 was read FIRST in
    #      this run, straight out of storage, which is the worst case for both.
    #   2. reading before the electrode equilibrated - specifically a SLOW
    #      settle. The run did pass the tightened 0.3 mV spread gate on every
    #      buffer, which sounds like it rules this out, and for a fast probe it
    #      would: a 0.3 mV spread over a 7.5 s window bounds the error left in
    #      the reading at 1.4 mV if tau is 30 s. But that bound scales with tau,
    #      and at tau = 300 s - a probe on its first dip out of dry storage -
    #      the same gate still admits 12.2 mV. The miss was 11.1 mV, on the
    #      buffer read first. The tau-independent check is the trend gate, and
    #      TOL_DRIFT_V=0.0005 could not fire underneath a 0.3 mV spread gate
    #      (the 1.385x cap explained in calibrate_ph.sh). It is 0.0001 now.
    #
    # ALSO CHECK THE TOP BOTTLE before refitting. The 9.00 point measured
    # -0.1178 V; the 9.18 buffer measured -0.1176 V on this rig on 2026-08-13,
    # 0.2 mV apart. If that bottle is really 9.18, refitting as 4.01/6.86/9.18
    # takes the worst residual from 0.216 to 0.153 - better, still failing, and
    # the middle point is still the outlier. So it is worth confirming, but it
    # is not the whole fault. (The 4.01/7.00/10.01 reading of the same voltages
    # fits to 0.035, but at 48.7 mV/pH = 82.3% of theoretical, which contradicts
    # the 98.7% the end points give and the 97-98% this electrode has held all
    # along. Ruled out: a mislabel that has to condemn a healthy probe to work
    # is the wrong explanation.)
    #
    # To refit: fresh 6.86 (or 7.00) buffer from a sealed bottle, soak the probe
    # for hours first per the note above, rinse and blot between dips, and run
    # the buffers low to high so carryover pushes toward the buffer already read.
    # RESID_MAX is 0.05 now, so the script will refuse to hand back a pair like
    # this one instead of printing it and moving on.

    ph_slope_solution:   -18.143116
    ph_offset_solution:   7.075699
